<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src ytmamp-media:; connect-src 'none'; object-src 'none'; base-uri 'none'">
    <title>YTMamp</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="container">
        <div id="top-region">
            <span>YTMAMP</span>
            <select id="source-select" aria-label="Playback source">
                <option value="local">LOCAL</option>
                <option value="ytm">YT MUSIC</option>
            </select>
            <button id="open-folder" title="Open music folder" aria-label="Open music folder">FOLDER</button>
            <button id="queue-toggle" aria-expanded="false" aria-controls="local-queue">LIST</button>
            <div id="status-group">
                <div id="vol-status">VOL: --</div>
                <div id="status-led" title="Offline"></div>
                <div id="close-btn" title="Close">X</div>
            </div>
        </div>

        <div id="main-content">
            <div id="left-panel">
                <canvas id="osc" width="140" height="40"></canvas>
            </div>
            <div id="right-panel">
                <div id="info-container">
                    <div id="title">YTMamp</div>
                    <div id="artist">Choose a music folder</div>
                </div>
                <div id="timer-container">
                    <div id="timer">00:00 / 00:00</div>
                </div>
                <div id="progress-container">
                    <div id="progress-track"></div>
                    <div id="progress-fill"></div>
                    <input type="range" id="progress-bar" aria-label="Track position" min="0" max="100" value="0">
                </div>
            </div>
        </div>

        <div id="bottom-bar">
            <div id="controls">
                <button id="prev-btn">Prev</button>
                <button id="play-pause-btn">P/P</button>
                <button id="next-btn">Next</button>
                <button id="like-btn" class="mini-btn" title="Like">Like</button>
                <button id="shuffle-btn" class="mini-btn" title="Shuffle">Shuf</button>
                <button id="repeat-btn" class="mini-btn" title="Repeat">Rep</button>
            </div>
            <div id="volume-container">
                <span id="volume-label">VOL</span>
                <input type="range" id="volume-slider" aria-label="Volume" min="0" max="100" value="50">
            </div>
        </div>
        <div id="plugin-panels" aria-live="polite"></div>
        <div id="debug-info"></div>
    </div>
    <section id="local-queue" aria-label="Local music queue" hidden>
        <div id="folder-row">
            <p id="folder-notice" role="status">Choose a folder. Music stays in its original location.</p>
            <button id="cancel-scan" hidden>Cancel</button>
        </div>
        <ol id="queue-tracks"></ol>
        <button id="queue-more" hidden>Show more tracks</button>
    </section>
    <script src="renderer.js"></script>
    <script src="local_audio.js"></script>
</body>

</html>
