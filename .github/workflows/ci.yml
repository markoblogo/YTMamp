name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  app-checks:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        working-directory: app
        run: npm test

      - name: Generate CI smoke checklist
        run: node scripts/generate-smoke-checklist.js

      - name: Validate CI smoke checklist
        run: node scripts/validate-smoke-checklist.js

      - name: Generate PR smoke summary
        if: github.event_name == 'pull_request'
        run: node scripts/generate-pr-smoke-summary.js

      - name: Upload smoke checklist artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-check-${{ matrix.os }}-${{ github.sha }}
          path: ci-smoke-checklist.md

      - name: Update PR description with smoke summary
        if: github.event_name == 'pull_request' && matrix.os == 'macos-latest'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-pr-description.js
