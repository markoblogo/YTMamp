name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  app-checks:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        working-directory: app
        run: npm test

      - name: Generate CI smoke checklist
        run: node scripts/generate-smoke-checklist.js

      - name: Upload smoke checklist artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-check-${{ matrix.os }}-${{ github.sha }}
          path: ci-smoke-checklist.md
